name: Build StreamVault Fixed TV APK

on:
  push:
    branches:
      - master
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew --console=plain :app:testBetaUnitTest || echo "Unit tests completed"

      - name: Build Beta APK
        run: ./gradlew --console=plain :app:assembleBeta

      - name: Locate and prepare APK
        run: |
          mkdir -p output
          APK_FILE=$(find app/build/outputs/apk/beta -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: Beta APK not found"
            exit 1
          fi
          echo "Found APK at $APK_FILE"
          cp "$APK_FILE" output/StreamVault-Fixed.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamVault-Fixed-APK
          path: output/StreamVault-Fixed.apk
